[package]
name = "zpg"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PostgreSQL table editor backend for Zed: CLI and language server"

[dependencies]
zpg-core = { path = "../zpg-core" }
clap = { version = "4.6", features = ["derive", "env"] }
lsp-server = "0.10"
lsp-types = "0.97"
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio-postgres-rustls = "0.13"
