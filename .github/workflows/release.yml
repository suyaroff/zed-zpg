name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p zpg --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf zpg-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release zpg
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/zpg.exe -DestinationPath zpg-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: zpg-${{ matrix.target }}.*
